[package]
name = "kurenai"
version = "0.2.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["default_no_backend", "native_tls_backend"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15.7"
rand = { version = "0.10.3", features = ["std", "sys_rng", "chacha"] }
sha3 = "0.12.0"
zeroize = "1.9.1"
zeroize_derive = "1.5.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
